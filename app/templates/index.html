<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Ceiling Fan Control</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1c1e21;
      --muted: #6b7280;
      --border: #e5e7eb;
      --off: #4b5563;
      --low: #38bdf8;
      --medium: #f59e0b;
      --high: #ef4444;
      --light: #eab308;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111318;
        --card: #1b1e24;
        --text: #f2f3f5;
        --muted: #9aa1ac;
        --border: #2c3038;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
      text-align: center;
    }
    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 14px;
      padding: 22px 12px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.15s ease, opacity 0.15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.6; cursor: wait; }
    button.high   { background: var(--high); }
    button.medium { background: var(--medium); }
    button.low    { background: var(--low); }
    button.off    { background: var(--off); }
    button.light  {
      width: 100%;
      background: var(--light);
      color: #1c1e21;
    }
    button.active {
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.22);
      transform: translateY(-1px);
    }
    .status-panel {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 0.8rem;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-chip.inactive {
      background: #e5e7eb;
      color: #475569;
    }
    #toast {
      margin-top: 18px;
      min-height: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      transition: opacity 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ceiling Fan</h1>
    <p class="subtitle">Sends UDP broadcast commands to the fan receiver</p>

    <div class="grid">
      <button class="high"   data-cmd="high">High</button>
      <button class="medium" data-cmd="medium">Medium</button>
      <button class="low"    data-cmd="low">Low</button>
      <button class="off"    data-cmd="off">Off</button>
    </div>

    <button class="light" data-cmd="light">Toggle Light</button>

    <div id="statusPanel" class="status-panel">Loading fan status…</div>
    <div id="toast">&nbsp;</div>
  </div>

  <script>
    const statusPanel = document.getElementById('statusPanel');
    const toast = document.getElementById('toast');
    let toastTimer;

    const statusKeyByCmd = {
      high: 'high',
      medium: 'medium',
      low: 'low',
      off: 'off',
      light: 'lights',
    };

    function showToast(text, isError) {
      clearTimeout(toastTimer);
      toast.textContent = text;
      toast.style.color = isError ? '#ef4444' : 'var(--muted)';
      toastTimer = setTimeout(() => { toast.textContent = ' '; }, 2500);
    }

    function setButtonsDisabled(value) {
      document.querySelectorAll('button[data-cmd]').forEach((btn) => {
        btn.disabled = value;
      });
    }

    function updateStatusUI(status = {}) {
      document.querySelectorAll('button[data-cmd]').forEach((btn) => {
        const key = statusKeyByCmd[btn.dataset.cmd];
        const active = key ? status[key] === 'on' : false;
        btn.classList.toggle('active', active);
      });

      if (!status || Object.keys(status).length === 0) {
        statusPanel.textContent = 'No fan status available';
        return;
      }

      statusPanel.innerHTML = Object.entries(status).map(([key, value]) => {
        const active = value === 'on';
        return `<span class="status-chip ${active ? '' : 'inactive'}">${key}: ${value}</span>`;
      }).join('');
    }

    function extractFanStatus(data) {
      return data.fanStatus?.current_status ?? data.fanStatus?.status ?? data.current_status ?? data.status;
    }

    async function sendCommand(command) {
      setButtonsDisabled(true);
      try {
        const res = await fetch(`/api/command/${command}`, { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'request failed');

        const fanStatus = extractFanStatus(data);
        if (fanStatus && typeof fanStatus === 'object') {
          updateStatusUI(fanStatus);
          showToast(`Sent: ${command}`, false);
        } else {
          showToast(`Sent: ${command} (status unavailable)`, false);
        }
      } catch (err) {
        showToast(`Error: ${err.message}`, true);
      } finally {
        setButtonsDisabled(false);
      }
    }

    async function refreshStatus() {
      setButtonsDisabled(true);
      try {
        const res = await fetch('/api/command/status', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'status request failed');

        const fanStatus = extractFanStatus(data);
        if (fanStatus && typeof fanStatus === 'object') {
          updateStatusUI(fanStatus);
          showToast('Fan status refreshed', false);
        } else {
          showToast('Fan status unavailable', true);
        }
      } catch (err) {
        showToast(`Error: ${err.message}`, true);
      } finally {
        setButtonsDisabled(false);
      }
    }

    document.querySelectorAll('button[data-cmd]').forEach((btn) => {
      btn.addEventListener('click', () => sendCommand(btn.dataset.cmd));
    });

    refreshStatus();
  </script>
</body>
</html>
